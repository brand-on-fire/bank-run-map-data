# Public-only collection. The probe exits in seconds when FDIC has nothing new;
# a rebuild runs only when a filing, branch, failure or bank-roster change appears.
# Schedule: daily in the filing months (FDIC posts a quarter about 50 days after it
# ends), days 1-15 of the following month, and weekly otherwise.
name: Collect bank data

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if FDIC reports no change
        type: boolean
        default: false
  schedule:
    - cron: '23 13 * 2,5,8,11 *'
    - cron: '23 13 1-15 3,6,9,12 *'
    - cron: '41 13 * * 1'

permissions:
  contents: read

concurrency:
  group: bank-run-map-collection
  cancel-in-progress: false

jobs:
  collect:
    # Evaluated before a runner is allocated: a wrong, private or forked
    # repository, or any branch other than the default branch, never runs.
    if: >-
      toJSON(github.event.repository.private) == 'false' &&
      github.event.repository.visibility == 'public' &&
      github.repository == 'brand-on-fire/bank-run-map-data' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check runtime (Node 22 or later, no install step)
        run: node scripts/check-runtime.mjs

      - name: Offline tests
        run: node --test tests/*.test.mjs

      - name: Restore last publication and collector state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs restore

      - name: Probe FDIC and rebuild what changed
        id: collect
        continue-on-error: true
        run: node scripts/collect.mjs ${{ inputs.force && '--force' || '' }}

      - name: Keepalive heartbeat (at most once per 30 days)
        id: keepalive
        if: always() && steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs keepalive

      - name: Validate and publish (always publishes status.json)
        if: always() && steps.restore.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs publish

      - name: Surface a failed check for a human
        if: always() && (steps.collect.outcome == 'failure' || steps.keepalive.outcome == 'failure')
        run: |
          echo "A source or gate failed: see status.json on the public-data branch. The last good data stays live."
          exit 1

# No cache, artifacts, secrets, paid API or Cloudflare binding. The only
# credential is the run's own GITHUB_TOKEN, passed to git through GIT_CONFIG_*.
